<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance &middot; Student Movement Tracker</title>
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #f7fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1a202c;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100dvh;
    }

    .maintenance-card {
      background: #ffffff;
      border: 1px solid #cbd5e0;
      border-top: 5px solid #0054B4;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 460px;
      width: 100%;
      padding: 32px 28px;
      text-align: center;
    }

    .maintenance-icon { font-size: 2.6rem; line-height: 1; margin-bottom: 14px; }

    .maintenance-card h1 {
      color: #003380;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }

    .maintenance-card p {
      color: #4a5568;
      font-size: 1rem;
      line-height: 1.6;
    }

    .maintenance-retry {
      margin-top: 24px;
      padding: 11px 26px;
      background-color: #0054B4;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .maintenance-retry:hover { background-color: #003875; }

    @media (max-width: 480px) {
      .maintenance-card { padding: 26px 20px; }
      .maintenance-card h1 { font-size: 1.2rem; }
      .maintenance-card p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- ===================================================================
       All maintenance wording lives here. index.html only decides WHETHER
       to load this page; it does not hold a copy of any of this text.
       Edit the heading and paragraph below to change what people see.
       =================================================================== -->
  <div class="maintenance-card">
    <div class="maintenance-icon">&#128736;&#65039;</div>

    <h1>Maintenance in Progress</h1>

    <p>
      WDLSS Student Movement Tracker is temporarily unavailable. Please check back shortly.<br><br>
      Do contact the SOS via WhatsApp or General Office if you require immediate information in the meantime.
    </p>

    <div>
      <button class="maintenance-retry" id="m-retry">Try Again</button>
    </div>
  </div>

  <script>
    // Reload the TOP window, not this frame. Reloading the frame would just fetch
    // this same notice again; reloading the top re-runs index.html, which re-reads
    // the MAINTENANCE flag and lets the app back in once it is switched off.
    // Falls back to reloading self when this page is opened directly rather than
    // framed — which is also how you preview styling changes without touching the flag.
    document.getElementById('m-retry').addEventListener('click', function () {
      try {
        window.top.location.reload();
      } catch (e) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
