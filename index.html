<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Student Movement Tracker</title>
  <!-- iOS standalone app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMT Tracker">
  <!-- Android standalone app -->
  <link rel="manifest" href="manifest.json">
  <!-- Home-screen icon -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- A single theme-color meta, rewritten at runtime by applyWrapperTheme(). -->
  <meta name="theme-color" id="theme-color-meta" content="#ffffff">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /**
     * Only a fallback for the frames before the head script runs. From then on the background is an
     * inline style written by applyWrapperTheme, which wins over all of this — including when the
     * band is pinned and no longer tracks the theme at all.
     */
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1A222C; }
    }
    html[data-theme="light"], html[data-theme="light"] body { background-color: #ffffff; }
    html[data-theme="dark"],  html[data-theme="dark"] body  { background-color: #1A222C; }

    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: env(safe-area-inset-top, 0px);
      pointer-events: none;
      visibility: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      border: none;
      display: block;
      background-color: inherit;
    }
  </style>

  <script>
    // ===== STATUS BAR STRIP =====
    /**
     * The band above the app is this page's background: the one part of the screen the app cannot
     * paint itself, since it runs on a different origin and cannot reach out of its iframe.
     *
     * followAppTheme makes the strip obey the theme chosen inside the app, so the two always match.
     * The trade-off is on iOS, where status-bar-style="default" makes the system take the clock and
     * battery colour from the phone's own appearance setting and ignore this page: a dark phone with
     * light chosen in the app shows white-on-white system text until the mismatch ends. Setting it
     * to false hands the strip back to the phone, giving a readable clock at the cost of a seam.
     *
     * bandColour is what actually fixed the lag in the installed app, and it is worth being clear
     * about why, because the two surfaces are lit by completely different mechanisms:
     *
     *   - In an ordinary Safari tab, the band at the top is Safari's own chrome, tinted from the
     *     theme-color meta. That one follows the app and is seamless now that the meta is written
     *     synchronously.
     *   - In the installed app, iOS reserves the safe-area inset and fills it from this page's
     *     background. There is no meta involved, and iOS crossfades that fill on its own schedule,
     *     which is the pale band left sitting above an already-dark app. Nothing this page does
     *     from JavaScript can make that crossfade finish sooner.
     *
     * So the band is pinned instead. A colour that reads correctly in both themes never has to
     * change, and a fill that never changes has no crossfade to lag behind. #0054B4 is --primary
     * from CSS_Themes, which is also what the navbar already paints behind the status bar wherever
     * the app is drawn under it, so the two agree. iOS picks white system text over it in both
     * themes.
     *
     * Set bandColour to null to go back to a band that follows the theme.
     */
    var STATUS_BAR = {
      followAppTheme: true,
      bandColour: '#0054B4'
    };

    var THEME_KEY = 'smt-theme';
    var THEME_COLOURS = { light: '#ffffff', dark: '#1A222C' };

    function readStoredTheme() {
      try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
    }

    /**
     * Two synchronous writes, which on iOS are disk I/O. The app re-announces its theme on every
     * foreground and on every modal open and close, so most calls would rewrite what is already
     * there; the pair actually stored is remembered and repeats are dropped.
     */
    var lastWritten = null;

    function writeStoredTheme(theme) {
      var pair = theme + '|' + systemTheme();
      if (pair === lastWritten) return;
      lastWritten = pair;

      try {
        localStorage.setItem(THEME_KEY, theme);
        localStorage.setItem('smt-theme-base', systemTheme());
      } catch (e) { /* storage blocked; the choice simply is not remembered */ }
    }

    function systemTheme() {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }

    /**
     * Paints the strip. Written as an inline style rather than left to the stylesheet, since the
     * cascade has too many ways to go wrong and this is the one thing on the page that must be
     * right.
     *
     * When the framed page supplies a colour it wins, because only that page knows which of its
     * surfaces borders the strip. The app sends its navbar (--surface), the maintenance notice
     * sends its page background, and while a modal is open the app sends the navbar already
     * composited with the modal's dim, so the strip greys out along with everything below it.
     *
     * The frame is painted along with the page. An iframe whose document has not painted yet is
     * transparent, so without this the wrapper's own colour would show through for the first frames
     * of a load, which is the white band seen on reload.
     *
     * @param {string} theme    'light' or 'dark'.
     * @param {string} [colour] A six-digit hex colour; anything else falls back to the theme's own.
     */
    var lastPainted = null;

    function applyWrapperTheme(theme, colour) {
      var resolved = theme === 'dark' ? 'dark' : 'light';

      if (!/^#[0-9a-fA-F]{6}$/.test(colour || '')) colour = THEME_COLOURS[resolved];

      // What fills this page's own background, which in the installed app is what iOS reserves and
      // crossfades. Pinned by default, so a theme change leaves it untouched and there is nothing
      // for iOS to animate.
      var band = /^#[0-9a-fA-F]{6}$/.test(STATUS_BAR.bandColour || '')
        ? STATUS_BAR.bandColour
        : colour;

      // Most messages arriving here ask for what is already on screen, and repainting still dirties
      // the iframe's backdrop and re-triggers Safari's tint crossfade.
      if (resolved + colour + band === lastPainted) return;

      // First, and synchronously. In an ordinary Safari tab the band at the top of the screen is
      // Safari's own chrome rather than anything this page paints, and its tint is read from this
      // meta. Safari crossfades that tint over roughly a quarter of a second, which makes it the
      // slowest surface involved in a theme change and the one that needs the earliest start. This
      // write used to sit in a setTimeout, on the reasoning that re-evaluating browser chrome need
      // not finish before the strip repaints — true, but it also meant the tint was not even
      // requested until after everything else, so the dark band stayed above an already-light app.
      // It stays on the app's own colour rather than the pinned one: Safari's chrome sits outside
      // the app and looks right matching it, and iOS ignores this meta in the installed app.
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', colour);

      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.backgroundColor = band;
      if (document.body) document.body.style.backgroundColor = band;

      // The frame keeps the app's own colour, not the band's. It is only ever visible in the frames
      // before the app's document has painted, and the point of filling it is that those frames
      // look like the app rather than like whatever is behind it.
      var frame = document.getElementById('app-frame');
      if (frame) frame.style.backgroundColor = colour;

      // Recorded only once there was a whole page to paint. The first call runs from <head>, where
      // neither the body nor the frame exists yet, and must not suppress the repeat that follows
      // them at the end of the body.
      if (document.body && frame) lastPainted = resolved + colour + band;
    }

    /** @return {string} The theme to show: the app's stored choice while current, else the device's. */
    function resolveTheme() {
      var system = systemTheme();
      var choice = readStoredTheme();
      var base = null;
      try { base = localStorage.getItem('smt-theme-base'); } catch (e) {}

      return (choice && base === system) ? choice : system;
    }

    applyWrapperTheme(resolveTheme());

    if (window.matchMedia) {
      var wrapperThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      var onWrapperThemeChange = function () {
        if (STATUS_BAR.followAppTheme) applyWrapperTheme(resolveTheme());
      };

      if (wrapperThemeQuery.addEventListener) wrapperThemeQuery.addEventListener('change', onWrapperThemeChange);
      else if (wrapperThemeQuery.addListener) wrapperThemeQuery.addListener(onWrapperThemeChange);
    }
  </script>
</head>
<body>
  <!-- Full-screen container. Its src is set at the end of the script below. -->
  <div id="safe-area-probe" aria-hidden="true"></div>
  <iframe id="app-frame" allow="geolocation; camera"></iframe>

  <script>
    /**
     * Maintenance switch. While enabled, every visitor is sent to MAINTENANCE_PAGE unless they
     * arrive with ?bypass=<bypassKey>.
     */
    const MAINTENANCE = {
      enabled: false,

      bypassKey: "admin"
    };

    const MAINTENANCE_PAGE = "maintenance.html";

    const baseUrl = "https://script.google.com/macros/s/AKfycbxpXslm2Kg1AA1-io4UgF0ewA7kJBMGT12S5OXRNdORn59lqSjhwwuCLUGw0YS8PCh5sw/exec";

    const currentParams = window.location.search;

    const submittedKey = new URLSearchParams(currentParams).get("bypass");

    /** @return {boolean} Whether this visitor should see the maintenance notice. */
    function isMaintenanceActive() {
      if (!MAINTENANCE.enabled) return false;

      if (MAINTENANCE.bypassKey && submittedKey === MAINTENANCE.bypassKey) return false;

      return true;
    }

    /**
     * Builds the maintenance page URL.
     *
     * "t" is a cache-buster. Reloading this outer page does not force a re-fetch of an iframe's
     * contents, and GitHub Pages adds a ten-minute max-age on top, so an edited maintenance.html
     * could otherwise stay invisible through a hard refresh. "bad" tells the notice that a key was
     * tried and rejected; only the verdict crosses over, never the key itself.
     *
     * @return {string}
     */
    function buildMaintenanceUrl() {
      let url = MAINTENANCE_PAGE + "?t=" + Date.now();
      if (submittedKey) url += "&bad=1";
      return url;
    }

    /**
     * Apps Script renders the web app inside a nested sandbox iframe, so messages arrive from a
     * per-deployment *.googleusercontent.com origin rather than from script.google.com itself.
     * That subdomain is not fixed, so the check matches the parent domain. maintenance.html is
     * same-origin.
     *
     * @param {string} origin
     * @return {boolean}
     */
    function isTrustedOrigin(origin) {
      try {
        if (origin === window.location.origin) return true;

        const host = new URL(origin).hostname;
        return host === "script.google.com" ||
               host === "googleusercontent.com" ||
               host.endsWith(".googleusercontent.com");
      } catch (e) {
        return false;
      }
    }

    /**
     * The app's own window, captured from the first message it sends. Reaching it by walking
     * frames would depend on Apps Script's nested sandbox layout; event.source does not.
     */
    var appWindow = null;

    /**
     * Sends the top safe-area inset to the app.
     *
     * env(safe-area-inset-top) resolves to zero inside an iframe, so the app cannot read it and the
     * value is measured here from #safe-area-probe and handed over.
     */
    var lastInsetSent = -1;

    function sendSafeArea(force) {
      if (!appWindow) return;

      var probe = document.getElementById('safe-area-probe');
      var inset = probe ? Math.round(probe.getBoundingClientRect().height) : 0;

      // Reading the probe is a forced layout here, and on the other side the value lands on a
      // custom property on :root, which invalidates the app's entire computed style. Neither is
      // worth doing for an inset that has not moved. "force" covers a fresh app document, which
      // starts with no --safe-top however recently the value was last sent.
      if (inset === lastInsetSent && !force) return;
      lastInsetSent = inset;

      try {
        appWindow.postMessage({ type: 'SAFE_AREA', top: inset }, '*');
      } catch (e) {
        console.debug('sendSafeArea: app not reachable.', e);
      }
    }

    window.addEventListener('resize', function () { sendSafeArea(false); });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { sendSafeArea(true); }, 100);
    });

    // Bound before the iframe is given a src. The app announces its theme as the first thing it
    // does, and a listener attached afterwards can miss that message on a warm cache.
    window.addEventListener("message", function(event) {
      if (!isTrustedOrigin(event.origin)) return;
      if (!event.data) return;

      if (event.data.type === "APP_READY") {
        appWindow = event.source;
        sendSafeArea(true);       // a document that has just loaded has no --safe-top yet
        return;
      }

      if (event.data.type === "THEME") {
        // Nothing runs before the repaint. Every frame on this page shares one main thread, so the
        // app cannot paint its own swap until this handler returns, and anything done first lands
        // on both. The inset used to be measured and echoed back from here, and the theme written
        // to storage, on every message — a forced layout, two synchronous writes and a full style
        // invalidation inside the app, all in front of the paint they were delaying.
        const theme = event.data.theme === "dark" ? "dark" : "light";
        const firstContact = !appWindow;
        appWindow = event.source;

        if (STATUS_BAR.followAppTheme) applyWrapperTheme(theme, event.data.colour);

        setTimeout(function () {
          writeStoredTheme(theme);
          if (firstContact) sendSafeArea(true);
        }, 0);
        return;
      }

      if (event.data.type !== "UPDATE_URL") return;

      const qs = event.data.queryString;
      if (typeof qs !== "string" || !/^\?[A-Za-z0-9=&%_.~-]*$/.test(qs)) return;

      const newUrl = window.location.protocol + "//" + window.location.host +
                     window.location.pathname + qs;

      window.history.replaceState({ path: newUrl }, '', newUrl);
    });

    document.getElementById("app-frame").src = isMaintenanceActive()
      ? buildMaintenanceUrl()
      : baseUrl + currentParams;

    applyWrapperTheme(resolveTheme());
  </script>
</body>
</html>
