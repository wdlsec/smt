<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Movement Tracker</title>
  <!-- iOS Full-Screen Standalone App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Chrome/Android address bar. iOS standalone ignores these and paints the
       status-bar strip with the body background instead, which is why the CSS
       below matters more than the meta tags on iPhone. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A222C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="SMT Tracker">
  <!-- Android Full-Screen Standalone App Settings -->
  <link rel="manifest" href="manifest.json">
  <!-- Icon Configuration -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /* The strip above the iframe on iOS standalone is this element's background.
       It sits directly above the app's NAVBAR, so it has to match the navbar
       surface (--surface: #1A222C), not the page background (--bg-light:
       #0F141A). Using the page colour is what produced the visible seam. */
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1A222C; }
    }
    /* Only ever set when STATUS_BAR.followAppTheme is on — see the script below. */
    html[data-theme="light"], html[data-theme="light"] body { background-color: #ffffff; }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #1A222C; }
    iframe {
      width: 100vw;
      height: 100dvh;
      position: fixed;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Dynamic full-screen container. Hosts either the Apps Script app or, during
       maintenance, the local maintenance.html notice. -->
  <iframe id="app-frame" allow="geolocation; camera"></iframe>

  <script>
    // =====================================================================
    // MAINTENANCE MODE
    // ---------------------------------------------------------------------
    // To take the app offline:   set enabled to true, commit.
    // To bring it back:          set enabled to false, commit.
    //
    // Flip the boolean rather than commenting the block out — a half-deleted
    // comment marker breaks the whole script and takes the page down with it.
    //
    // The wording of the notice is NOT here. It lives in maintenance.html;
    // edit that file to change what people read.
    // =====================================================================
    // =====================================================================
    // STATUS BAR STRIP (iOS standalone)
    // ---------------------------------------------------------------------
    // The band above the app is this page's background, and it is the only
    // part of the screen the app itself cannot paint.
    //
    // followAppTheme = false (default, recommended)
    //   The strip follows the PHONE's appearance setting. This is deliberate:
    //   with apple-mobile-web-app-status-bar-style="default", iOS picks the
    //   clock and battery text colour from the system setting and ignores this
    //   page entirely. Force the strip light on a dark-mode phone and the clock
    //   goes white-on-white; force it dark on a light phone and it goes
    //   black-on-black. So someone who overrides the theme inside the app sees
    //   one band that does not match — and a status bar they can still read.
    //
    // followAppTheme = true
    //   The strip obeys whatever was chosen inside the app. Seamless in every
    //   case except a deliberate override, where the status bar text may become
    //   hard or impossible to read. Only worth it if your users never fight
    //   their phone's own setting.
    // =====================================================================
    const STATUS_BAR = {
      followAppTheme: false
    };

    const MAINTENANCE = {
      enabled: true,

      // Append ?bypass=<this value> to the URL to load the real app while everyone
      // else sees the notice. Useful for verifying a fix before going live again.
      // This is convenience, not security: anyone reading the page source can find
      // it. Change it to something only you would guess.
      bypassKey: "admin"
    };

    // The notice page, relative to this file.
    const MAINTENANCE_PAGE = "maintenance.html";

    // Base Google Apps Script URL
    const baseUrl = "https://script.google.com/macros/s/AKfycbxpXslm2Kg1AA1-io4UgF0ewA7kJBMGT12S5OXRNdORn59lqSjhwwuCLUGw0YS8PCh5sw/exec";

    // Extract any query parameters attached to the GitHub link (e.g., "?page=form")
    const currentParams = window.location.search;

    // The key that was submitted this visit, if any. The hidden panel in
    // maintenance.html reloads this page with ?bypass=<key> attached.
    const submittedKey = new URLSearchParams(currentParams).get("bypass");

    function isMaintenanceActive() {
      if (!MAINTENANCE.enabled) return false;

      // Bypass for whoever is doing the maintenance.
      if (MAINTENANCE.bypassKey && submittedKey === MAINTENANCE.bypassKey) return false;

      return true;
    }

    // Builds the notice URL.
    //
    // "t" is a cache-buster, and it matters more than it looks. Reloading this outer
    // page does NOT force the browser to re-fetch an iframe's contents — it happily
    // reuses its cached copy — and GitHub Pages serves HTML with a ten-minute
    // max-age on top of that. So after editing maintenance.html you could hard-refresh
    // and still be shown the previous wording. A URL the cache has never seen
    // sidesteps both layers, and costs nothing: this page is only ever requested
    // while the app is deliberately offline.
    //
    // "bad" tells the notice that a key was tried and rejected, so it can reopen the
    // panel with an error. Only the verdict crosses over — the key never leaves
    // this file.
    function buildMaintenanceUrl() {
      let url = MAINTENANCE_PAGE + "?t=" + Date.now();
      if (submittedKey) url += "&bad=1";
      return url;
    }

    // The iframe's src is set to exactly one of these two. During maintenance the
    // Apps Script URL is never requested at all — the app does not load behind the
    // notice, so there is nothing to flash into view on a slow connection.
    document.getElementById("app-frame").src = isMaintenanceActive()
      ? buildMaintenanceUrl()
      : baseUrl + currentParams;

    // Apps Script renders the web app inside a nested sandbox iframe, so the message
    // arrives from a per-deployment *.googleusercontent.com origin rather than from
    // script.google.com itself. That subdomain is not fixed, so the check matches the
    // parent domain instead of one exact string.
    function isTrustedOrigin(origin) {
      try {
        const host = new URL(origin).hostname;
        return host === "script.google.com" ||
               host === "googleusercontent.com" ||
               host.endsWith(".googleusercontent.com");
      } catch (e) {
        return false;
      }
    }

    // Listen for navigation updates sent from the Apps Script iframe
    window.addEventListener("message", function(event) {
      // Any page on the internet can postMessage to this window. Without an origin
      // check, an unrelated tab could rewrite the address bar shown to the user.
      if (!isTrustedOrigin(event.origin)) return;

      if (!event.data) return;

      // The app tells us which theme it settled on. The wrapper cannot read the
      // app's localStorage (different origin), so this message is the only way to
      // know that someone chose dark on a light device, or the reverse.
      if (event.data.type === "THEME") {
        if (STATUS_BAR.followAppTheme) {
          const theme = event.data.theme === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);

          const meta = document.querySelector('meta[name="theme-color"]:not([media])') ||
                       document.head.appendChild(Object.assign(document.createElement("meta"), { name: "theme-color" }));
          meta.setAttribute("content", theme === "dark" ? "#1A222C" : "#ffffff");
        }
        return;
      }

      if (event.data.type !== "UPDATE_URL") return;

      // Only accept a plain query string. This is what the app sends, and it keeps a
      // malformed or hostile value from reaching history.replaceState.
      const qs = event.data.queryString;
      if (typeof qs !== "string" || !/^\?[A-Za-z0-9=&%_.~-]*$/.test(qs)) return;

      const newUrl = window.location.protocol + "//" + window.location.host +
                     window.location.pathname + qs;

      // Update browser URL without triggering a page reload
      window.history.replaceState({ path: newUrl }, '', newUrl);
    });
  </script>
</body>
</html>
