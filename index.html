<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Movement Tracker</title>
  <!-- iOS Full-Screen Standalone App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SMT Tracker">
  <!-- Android Full-Screen Standalone App Settings -->
  <link rel="manifest" href="manifest.json">
  <!-- Icon Configuration -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- One theme-color meta, rewritten by script. -->
  <meta name="theme-color" id="theme-color-meta" content="#ffffff">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /**
     * On iOS standalone the strip above the iframe is this element's background, and it borders the
     * app's NAVBAR, so it uses --surface (#1A222C) rather than the page background (--bg-light,
     * #0F141A).
     */
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1A222C; }
    }
    html[data-theme="light"], html[data-theme="light"] body { background-color: #ffffff; }
    html[data-theme="dark"],  html[data-theme="dark"] body  { background-color: #1A222C; }

    iframe {
      width: 100vw;
      height: 100dvh;
      position: fixed;
      border: none;
      display: block;
    }
  </style>

  <script>
    // ===== STATUS BAR STRIP =====
    // The band above the app is this page's background — the one part of the screen the app cannot
    // paint itself, because it runs on a different origin and cannot reach out of its iframe.
    //
    // followAppTheme = true (default): the strip obeys the theme chosen inside the app, so the two
    // always match. The catch is iOS: with status-bar-style="default" the system picks the clock and
    // battery colour from the PHONE's appearance setting and ignores this page, so a dark phone with
    // light chosen in the app gets white-on-white system text until that mismatch ends. Set this to
    // false to hand the strip back to the phone — a readable clock, at the cost of a visible seam.
    var STATUS_BAR = {
      followAppTheme: true
    };

    var THEME_KEY = 'smt-theme';
    var THEME_COLOURS = { light: '#ffffff', dark: '#1A222C' };

    function readStoredTheme() {
      try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
    }

    function writeStoredTheme(theme) {
      try {
        localStorage.setItem(THEME_KEY, theme);
        localStorage.setItem('smt-theme-base', systemTheme());
      } catch (e) { /* private mode */ }
    }

    function systemTheme() {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }

    /**
     * Paints the strip. Written as an inline style rather than left to the stylesheet: the cascade
     * has too many ways to go wrong here, and this is the one thing on the page that has to be right.
     *
     * `colour` is optional, and when the framed page supplies one it wins — only that page knows
     * which of its surfaces borders the strip. The app sends its navbar (--surface), the maintenance
     * notice sends its page background, and while a modal is open the app sends the navbar already
     * composited with the modal's dim so the strip greys out along with everything below it.
     */
    function applyWrapperTheme(theme, colour) {
      var resolved = theme === 'dark' ? 'dark' : 'light';

      if (!/^#[0-9a-fA-F]{6}$/.test(colour || '')) colour = THEME_COLOURS[resolved];

      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.backgroundColor = colour;
      if (document.body) document.body.style.backgroundColor = colour;

      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', colour);
    }

    function resolveTheme() {
      var system = systemTheme();
      var choice = readStoredTheme();
      var base = null;
      try { base = localStorage.getItem('smt-theme-base'); } catch (e) {}

      return (choice && base === system) ? choice : system;
    }

    applyWrapperTheme(resolveTheme());

    if (window.matchMedia) {
      var wrapperThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      var onWrapperThemeChange = function () {
        if (STATUS_BAR.followAppTheme) applyWrapperTheme(resolveTheme());
      };

      if (wrapperThemeQuery.addEventListener) wrapperThemeQuery.addEventListener('change', onWrapperThemeChange);
      else if (wrapperThemeQuery.addListener) wrapperThemeQuery.addListener(onWrapperThemeChange);
    }
  </script>
</head>
<body>
  <!-- Dynamic full-screen container. -->
  <iframe id="app-frame" allow="geolocation; camera"></iframe>

  <script>
    const MAINTENANCE = {
      enabled: true,

      bypassKey: "admin"
    };

    const MAINTENANCE_PAGE = "maintenance.html";

    const baseUrl = "https://script.google.com/macros/s/AKfycbxpXslm2Kg1AA1-io4UgF0ewA7kJBMGT12S5OXRNdORn59lqSjhwwuCLUGw0YS8PCh5sw/exec";

    const currentParams = window.location.search;

    const submittedKey = new URLSearchParams(currentParams).get("bypass");

    function isMaintenanceActive() {
      if (!MAINTENANCE.enabled) return false;

      if (MAINTENANCE.bypassKey && submittedKey === MAINTENANCE.bypassKey) return false;

      return true;
    }

    // "t" is a cache-buster and it matters more than it looks: reloading this outer page does not
    // force a re-fetch of an iframe's contents, and GitHub Pages adds a ten-minute max-age on top, so
    // an edited maintenance.html could stay invisible through a hard refresh. "bad" tells the notice
    // a key was tried and rejected — only the verdict crosses over, never the key.
    function buildMaintenanceUrl() {
      let url = MAINTENANCE_PAGE + "?t=" + Date.now();
      if (submittedKey) url += "&bad=1";
      return url;
    }

    // Apps Script renders the web app inside a nested sandbox iframe, so messages arrive from a
    // per-deployment *.googleusercontent.com origin rather than from script.google.com itself. That
    // subdomain is not fixed, so the check matches the parent domain. maintenance.html is same-origin.
    function isTrustedOrigin(origin) {
      try {
        if (origin === window.location.origin) return true;

        const host = new URL(origin).hostname;
        return host === "script.google.com" ||
               host === "googleusercontent.com" ||
               host.endsWith(".googleusercontent.com");
      } catch (e) {
        return false;
      }
    }

    // Listen BEFORE the iframe is given a src: the app announces its theme as the very first thing
    // it does, and a listener attached afterwards can miss that message on a warm cache.
    window.addEventListener("message", function(event) {
      if (!isTrustedOrigin(event.origin)) return;
      if (!event.data) return;

      if (event.data.type === "THEME") {
        const theme = event.data.theme === "dark" ? "dark" : "light";
        writeStoredTheme(theme);
        if (STATUS_BAR.followAppTheme) applyWrapperTheme(theme, event.data.colour);
        return;
      }

      if (event.data.type !== "UPDATE_URL") return;

      const qs = event.data.queryString;
      if (typeof qs !== "string" || !/^\?[A-Za-z0-9=&%_.~-]*$/.test(qs)) return;

      const newUrl = window.location.protocol + "//" + window.location.host +
                     window.location.pathname + qs;

      window.history.replaceState({ path: newUrl }, '', newUrl);
    });

    document.getElementById("app-frame").src = isMaintenanceActive()
      ? buildMaintenanceUrl()
      : baseUrl + currentParams;

    applyWrapperTheme(resolveTheme());
  </script>
</body>
</html>
