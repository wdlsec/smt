<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pinch-zoom is allowed; every input is 16px, so iOS still never zooms in when a field is tapped. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Movement Tracker</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMT Tracker">

  <!-- ?v= busts browser and GitHub Pages caches: bump it whenever an icon or the manifest changes. -->
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="preconnect" href="https://script.google.com">

  <!-- Each place gets the file drawn for it: iOS home screen, browser tab, Android/desktop fallback. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

  <!-- Status bar / Safari bars: one fixed colour in every theme, so there is nothing to switch or lag. -->
  <meta name="theme-color" content="#003380">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /*
     * Safari tints its top and bottom bars from the page's own colours (the iframe sits at the top),
     * so the page carries the same fixed #003380 as theme-color and the manifest. The home-screen app
     * swaps it for the app's page colour (see HOME-SCREEN BACKGROUND).
     */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #003380;
    }

    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: env(safe-area-inset-top, 0px);
      pointer-events: none;
      visibility: hidden;
    }

    /* Stays invisible (and untouchable) until the app says it has painted, so a blank frame never shows. */
    iframe {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      border: none;
      display: block;
      background-color: transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    iframe.is-ready { opacity: 1; pointer-events: auto; }

    /*
     * Home-screen app on some iOS 26 installs (WebKit bug 301994): the page is given one status bar
     * less than the screen (793px of 852px) and anything position: fixed stops there, leaving a strip
     * at the bottom. With html.ios-gap (set by fitStandaloneGap) the page is made taller by the
     * missing --ios-gap and the frame is placed in the page instead of fixed, so it runs to the
     * bottom of the screen. Window scrolling is held at the top, so the extra height never scrolls.
     */
    html.ios-gap,
    html.ios-gap body { overflow: visible; height: calc(100% + var(--ios-gap)); }

    /*
     * Home-screen app: the loading screen is sized to the phone's screen from the first frame, not
     * to the page, so when iOS changes the page height a moment after opening its centre (walker and
     * title) does not jump.
     */
    html.is-standalone #splash { bottom: auto; height: var(--screen-h); }
    html.ios-gap iframe { position: absolute; height: var(--ios-screen); }

    /* ===== SPLASH: walker and title; a notice and Reload appear only when loading stalls. ===== */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #003380;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    #splash .splash-title { font-size: 1rem; font-weight: 600; letter-spacing: 0.04em; }

    /* No dots, then . then .. then ... on repeat; hidden dots keep their space, so the words never shift. */
    #splash .dots span { animation: 2s steps(1, end) infinite; }
    #splash .dots span:nth-child(1) { animation-name: dot-step-1; }
    #splash .dots span:nth-child(2) { animation-name: dot-step-2; }
    #splash .dots span:nth-child(3) { animation-name: dot-step-3; }
    @keyframes dot-step-1 { 0% { opacity: 0; } 25% { opacity: 1; } }
    @keyframes dot-step-2 { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes dot-step-3 { 0% { opacity: 0; } 75% { opacity: 1; } }
    #splash .splash-note { font-size: 0.875rem; color: rgba(255, 255, 255, 0.75); min-height: 1.2em; }
    #splash .splash-reload {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #003380;
      background: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 9px 13px 11px;   /* 1px less on top: the font sits low in its line box, so this centres the word */
      cursor: pointer;
    }
    #splash .splash-reload:active { transform: scale(0.97); }
    #splash [hidden] { display: none; }

    /*
     * Walking on the spot, upright and facing right: 1s per stride, so each footstep lasts one dot
     * step (0.5s). There is deliberately no reduced-motion variant, so it runs at this speed on
     * every device. Each leg spends 55% of the stride planted (sweeping back at a steady pace,
     * knee almost straight), then lifts with an easy knee bend and swings forward, so a foot is
     * always on the ground. The body dips 1px when both feet are down, keeping the planted foot level.
     * Dressed in the boys' uniform: a polo fading from white at the collar to light blue at the hem
     * (sleeves included), light blue long pants and white shoes. The head and forearms are emoji
     * yellow, a colour that reads as anyone rather than any one skin tone.
     */
    .walker { width: 50px; height: 75px; overflow: visible; margin-bottom: -3px; }
    .walker line, .walker path { stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .walker .shirt { stroke: url(#walker-shirt); }
    .walker .pants { stroke: #7fb2e5; }
    .walker .skin { stroke: #ffcc4d; }
    .walker .feet { stroke: #ffffff; }
    .walker .head { fill: #ffcc4d; stroke: none; }
    .walker .shadow { fill: rgba(0, 0, 0, 0.3); stroke: none; }

    .walker .body   { animation: walk-bob 0.5s linear infinite; }
    .walker .thigh  { transform-box: view-box; transform-origin: 32px 52px; animation: walk-thigh 1s linear infinite; }
    .walker .shin   { transform-box: view-box; transform-origin: 32px 70px; animation: walk-shin 1s linear infinite; }
    .walker .arm    { transform-box: view-box; transform-origin: 32px 27px; animation: walk-arm 1s ease-in-out infinite; }
    .walker .far .thigh, .walker .far .shin, .walker .near .arm { animation-delay: -0.5s; }

    @keyframes walk-bob {
      0%, 100% { transform: translateY(1px); animation-timing-function: ease-out; }
      55%      { transform: translateY(0);   animation-timing-function: ease-in; }
    }
    @keyframes walk-thigh {
      0%, 100% { transform: rotate(-18deg); }
      55%      { transform: rotate(18deg);  animation-timing-function: ease-in-out; }
    }
    @keyframes walk-shin {
      0%, 100% { transform: rotate(0deg); }
      30%      { transform: rotate(3deg); }
      55%      { transform: rotate(6deg);  animation-timing-function: ease-in-out; }
      74%      { transform: rotate(40deg); animation-timing-function: ease-in-out; }
      92%      { transform: rotate(6deg); }
    }
    @keyframes walk-arm { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  </style>

  <script>
    /**
     * ===== HOME-SCREEN BACKGROUND =====
     * On some iOS 26 home-screen installs the page is given one status bar less than the screen
     * (793px of 852px), and iOS fills the strip below it with the page's background colour from when
     * the app opened (WebKit bug 301994); no page content can reach it. So in home-screen mode the page
     * behind everything is the app's own background (--bg-light in CSS_Themes) from the first paint,
     * in the theme the app last used here, and that strip reads as part of the app. Browser tabs keep
     * the navy above.
     */
    var STANDALONE = window.navigator.standalone === true;
    var PAGE_COLOURS = { light: '#f7fafc', dark: '#0F141A' };
    var THEME_KEY = 'smt-wrapper-theme';

    var standaloneTheme = null;
    var standalonePainted = false;

    /** The page goes to the app's colour once the app has painted; until then it stays navy, so the loading screen fills the screen. */
    function setStandaloneTheme(theme, remember) {
      if (!STANDALONE) return;
      standaloneTheme = theme === 'dark' ? 'dark' : 'light';
      var colour = standalonePainted ? PAGE_COLOURS[standaloneTheme] : '';
      document.documentElement.style.backgroundColor = colour;
      if (document.body) document.body.style.backgroundColor = colour;
      if (remember !== false) {
        try { localStorage.setItem(THEME_KEY, standaloneTheme); } catch (e) {}
      }
    }

    function setStandalonePainted(isPainted) {
      standalonePainted = isPainted;
      if (standaloneTheme) setStandaloneTheme(standaloneTheme, false);
    }

    /**
     * Home-screen app only: how far the page falls short of the screen, applied as html.ios-gap /
     * --ios-gap. Once found it stays on: stretching the page makes iOS report a new size, and
     * re-measuring then would undo the stretch and loop. It is cleared only on rotation, then
     * measured again. 0 (and nothing applied) on a normal install.
     */
    var iosGap = 0;

    function fitStandaloneGap() {
      if (!STANDALONE || iosGap) return;
      var w = window.innerWidth, h = window.innerHeight;
      var screenH = h > w ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      var gap = Math.round(screenH - h);
      if (gap < 1 || gap > 100) return;
      iosGap = gap;
      // The frame takes the measured screen height, not 100dvh + gap: iOS can later report 100dvh as
      // the full screen, which would push the bottom of the app off the screen.
      document.documentElement.style.setProperty('--ios-screen', screenH + 'px');
      document.documentElement.style.setProperty('--ios-gap', gap + 'px');
      document.documentElement.classList.add('ios-gap');
      if (window.scrollY) window.scrollTo(0, 0);
    }

    /** iOS can shrink the page after it first lays out, so the gap is also looked for on load, when the app paints and shortly after. */
    if (STANDALONE) {
      (function () {
        var portrait = window.innerHeight >= window.innerWidth;
        var screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        document.documentElement.style.setProperty('--screen-h', screenH + 'px');
        document.documentElement.classList.add('is-standalone');
      })();
      fitStandaloneGap();
      window.addEventListener('resize', fitStandaloneGap);
      window.addEventListener('load', function () {
        fitStandaloneGap();
        setTimeout(fitStandaloneGap, 300);
        setTimeout(fitStandaloneGap, 1500);
      });
      window.addEventListener('orientationchange', function () {
        iosGap = 0;
        document.documentElement.classList.remove('ios-gap');
        setTimeout(fitStandaloneGap, 300);
      });
    }

    (function () {
      if (!STANDALONE) return;
      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
      var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      setStandaloneTheme(saved || system, false);
      document.addEventListener('DOMContentLoaded', function () { setStandaloneTheme(saved || system, false); });
    })();
  </script>

</head>
<body>

  <div id="safe-area-probe" aria-hidden="true"></div>
  <div id="splash" role="status" aria-live="polite">
    <svg class="walker" viewBox="0 0 64 96" aria-hidden="true" focusable="false">
      <defs>
        <!-- Polo: white down to the chest, then fading to light blue at the hem (y 24 to 52). -->
        <linearGradient id="walker-shirt" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="54">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.3" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#5ec3ee"/>
        </linearGradient>
      </defs>
      <ellipse class="shadow" cx="32" cy="90" rx="17" ry="3"/>
      <g class="body">
        <g class="far">
          <g class="arm"><path class="skin" d="M32 33 L32 39 L35 49"/><line class="shirt" x1="32" y1="27" x2="32" y2="33"/></g>
          <g class="thigh"><line class="pants" x1="32" y1="52" x2="32" y2="70"/><g class="shin"><line class="pants" x1="32" y1="70" x2="32" y2="83"/><path class="feet" d="M32 86 L38 86"/></g></g>
        </g>
        <line class="shirt" x1="32" y1="24" x2="32" y2="52"/>
        <circle class="head" cx="32" cy="12" r="9"/>
        <g class="near">
          <g class="thigh"><line class="pants" x1="32" y1="52" x2="32" y2="70"/><g class="shin"><line class="pants" x1="32" y1="70" x2="32" y2="83"/><path class="feet" d="M32 86 L38 86"/></g></g>
          <g class="arm"><path class="skin" d="M32 33 L32 39 L35 49"/><line class="shirt" x1="32" y1="27" x2="32" y2="33"/></g>
        </g>
      </g>
    </svg>
    <div class="splash-title">Loading tracker<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="splash-note" id="splash-note"></div>
    <button type="button" class="splash-reload" id="splash-reload" hidden>Reload</button>
  </div>
  <!-- No permissions are granted to the frame: the app uses none (Mass Upload's paste is an ordinary paste event). -->
  <iframe id="app-frame"></iframe>

  <script>
    /**
     * The Apps Script deployment. Sign-in, maintenance mode and the "official page only" check are all
     * handled there (doGet and the sign-in page). If the web app ever gets a new deployment rather
     * than a new version of this one, its /exec address changes and must be updated here.
     */
    const baseUrl = "https://script.google.com/macros/s/AKfycbyxhbcJ736aRQe07CjxT8AsObc2y7lGKqhTuHcU5EoM7Alb8IhkfI4cBtQdDZJ4ZuVXPA/exec";

    /**
     * What this browser keeps (localStorage, so it survives switching to the Mail app and back, and
     * closing the home-screen app):
     *   smt-token   the sign-in token the server issued
     *   smt-device  this browser's device ID ("id.sig"); kept after signing out, as it gives no access
     *   smt-signin  a code request in progress: {req, email, query, at}, dropped after PENDING_MS
     * The page's own parameters (page, tab, reason, location) are kept in the pending request too,
     * because relaunching the home-screen app opens the manifest's start address without them.
     */
    const TOKEN_KEY = "smt-token";
    const DEVICE_KEY = "smt-device";
    const PENDING_KEY = "smt-signin";
    const PENDING_MS = 10 * 60000;
    /** Never shown in the address bar or passed on from it; teacher= is the old prefill, ignored now. */
    const HIDDEN_PARAMS = ["embed", "access", "bypass", "r", "debug", "token", "dev", "req", "email", "teacher"];

    /** Shapes the server issues (Backend.gs TOKEN_PATTERN, DEVICE_ID_PATTERN, REQUEST_ID_PATTERN). */
    const TOKEN_SHAPE = /^[0-9a-z]{1,11}\.[0-9a-f]{16}\.[0-9a-f]{24}\.[A-Za-z0-9_-]{4,200}\.[A-Za-z0-9_-]{43}$/;
    const DEVICE_SHAPE = /^[0-9a-f]{24}\.[0-9a-f]{16}$/;
    const REQUEST_SHAPE = /^[0-9a-f]{32}$/;

    /** ?debug=1 shows the viewport measurements over the page, for diagnosing iOS layout bugs. Read before the URL is cleaned. */
    const DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";

    /** Loading watchdog: show Reload after SLOW_MS, retry once by itself after RETRY_MS. */
    const SLOW_MS = 12000;
    const RETRY_MS = 25000;
    /** How long the app has to answer the check made on returning to this tab. */
    const ALIVE_MS = 3000;

    // ===== STORAGE =====
    /** localStorage, with an in-memory copy for browsers that block it (a private window). */
    var memoryStore = {};

    function readStore(key) {
      try { return localStorage.getItem(key) || memoryStore[key] || ""; } catch (e) { return memoryStore[key] || ""; }
    }

    function writeStore(key, value) {
      memoryStore[key] = value;
      try {
        if (value) localStorage.setItem(key, value);
        else localStorage.removeItem(key);
      } catch (e) {}
    }

    /** The code request in progress, or null once it is older than PENDING_MS. */
    function readPending() {
      var pending = null;
      try { pending = JSON.parse(readStore(PENDING_KEY) || "null"); } catch (e) {}
      if (!pending || !REQUEST_SHAPE.test(pending.req || "") || !(Date.now() - pending.at < PENDING_MS)) {
        if (pending) writeStore(PENDING_KEY, "");
        return null;
      }
      return pending;
    }

    // The tab-only access token of the old admin-key sign-in; no longer used.
    try { sessionStorage.removeItem("smt-access"); } catch (e) {}

    /** The address bar's own parameters (page, tab, prefills) with the hidden ones stripped, so an old ?bypass= or ?teacher= neither shows nor does anything. */
    function visibleParams() {
      const params = new URLSearchParams(window.location.search);
      let changed = false;

      HIDDEN_PARAMS.forEach(function (name) {
        if (params.has(name)) { params.delete(name); changed = true; }
      });

      if (changed) setAddressQuery(params.toString());
      return params;
    }

    function setAddressQuery(qs) {
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs.replace(/^\?/, '') : ''));
    }

    /**
     * The frame's address: the page's parameters, then the stored token, device ID and any code
     * request in progress. A home-screen app relaunched while its user fetched a code opens without
     * its parameters, so they come back from the pending request. "r" makes every load a fresh
     * address, so a browser refresh can never hand back a stale copy of the frame.
     */
    function buildAppUrl() {
      let params = visibleParams();
      const pending = readPending();
      if (pending && pending.query && !params.toString()) {
        setAddressQuery(pending.query);
        params = visibleParams();
      }
      params.set("embed", "1");

      const token = readStore(TOKEN_KEY);
      const device = readStore(DEVICE_KEY);
      if (TOKEN_SHAPE.test(token)) params.set("token", token);
      if (DEVICE_SHAPE.test(device)) params.set("dev", device);
      if (pending) {
        params.set("req", pending.req);
        params.set("email", pending.email || "");
      }

      params.set("r", Date.now().toString(36));
      return baseUrl + "?" + params.toString();
    }

    /** Apps Script renders the web app inside a nested sandbox iframe, so messages arrive from a per-deployment *.googleusercontent.com origin rather than from script.google.com itself. */
    function isTrustedOrigin(origin) {
      try {
        if (origin === window.location.origin) return true;

        const host = new URL(origin).hostname;
        return host === "script.google.com" ||
               host === "googleusercontent.com" ||
               host.endsWith(".googleusercontent.com");
      } catch (e) {
        return false;
      }
    }

    /**
     * Whether a message came from inside this page's own frame: the app runs in Apps Script's
     * sandbox frames within the script.google.com page loaded in #app-frame, so its window (or one
     * of its parents) is that frame's window. Checked before the origin, so no other window on the
     * page, or a tab that opened this one, can drive the wrapper.
     */
    function isFromAppFrame(source) {
      var frame = document.getElementById('app-frame');
      var target = frame && frame.contentWindow;
      if (!target || !source) return false;
      for (var w = source, depth = 0; w && depth < 5; depth++) {
        if (w === target) return true;
        if (w === w.parent) return false;
        w = w.parent;
      }
      return false;
    }

    /** The app's own window, captured from the first message it sends. */
    var appWindow = null;

    /** Posts to the app; these messages (layout, health checks) carry nothing secret. */
    function postToApp(message) {
      if (!appWindow) return;
      try { appWindow.postMessage(message, '*'); } catch (e) {}
    }

    // ===== LOADING & WATCHDOG =====
    var painted = false;
    var autoRetried = false;
    var slowTimer = null;
    var retryTimer = null;

    function setSplashNote(text, showReload) {
      document.getElementById('splash-note').textContent = text || '';
      document.getElementById('splash-reload').hidden = !showReload;
    }

    /** Shows the app once it has painted; the splash stays underneath, covered. */
    function revealFrame() {
      painted = true;
      clearTimeout(slowTimer);
      clearTimeout(retryTimer);
      setSplashNote('', false);
      document.getElementById('app-frame').classList.add('is-ready');
      fitStandaloneGap();
      setStandalonePainted(true);
    }

    /** Still nothing after SLOW_MS: say so and offer Reload, while the load carries on. */
    function onSlowLoad() {
      if (painted) return;
      setSplashNote(navigator.onLine === false
        ? 'No internet connection. It will load once you are back online.'
        : 'Sorry, taking longer than usual.', true);
    }

    /**
     * (Re)loads the frame behind the splash. The watchdog restarts with each load; a load the app
     * never paints gets one automatic retry, after which only Reload starts another.
     *
     * @param {boolean} [isAutoRetry]
     */
    function loadApp(isAutoRetry) {
      var frame = document.getElementById('app-frame');
      frame.classList.remove('is-ready');

      painted = false;
      setStandalonePainted(false);
      appWindow = null;
      lastInsetSent = -1;
      lastKeyboardSent = -1;
      cancelAliveCheck();
      if (!isAutoRetry) {
        autoRetried = false;
        setSplashNote('', false);
      }

      clearTimeout(slowTimer);
      clearTimeout(retryTimer);
      slowTimer = setTimeout(onSlowLoad, SLOW_MS);
      if (!autoRetried) {
        retryTimer = setTimeout(function () {
          if (painted) return;
          autoRetried = true;
          loadApp(true);
        }, RETRY_MS);
      }

      frame.src = buildAppUrl();
    }

    document.getElementById('splash-reload').addEventListener('click', function () { loadApp(false); });

    window.addEventListener('online', function () {
      if (!painted) loadApp(false);
    });

    // ===== CHECK ON RETURN =====
    /** Returning to the tab or home-screen app: the app must answer, or the frame is reloaded behind the splash. */
    var aliveTimer = null;
    var aliveNonce = null;

    function cancelAliveCheck() {
      clearTimeout(aliveTimer);
      aliveTimer = null;
      aliveNonce = null;
    }

    function checkAppAlive() {
      if (!painted || aliveTimer) return;
      if (!appWindow) return loadApp(false);

      aliveNonce = Math.random().toString(36).slice(2);
      aliveTimer = setTimeout(function () {
        aliveTimer = null;
        loadApp(false);
      }, ALIVE_MS);

      try {
        appWindow.postMessage({ type: 'WRAPPER_HEALTH', nonce: aliveNonce }, '*');
      } catch (e) {
        cancelAliveCheck();
        loadApp(false);
      }
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) checkAppAlive();
    });
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) checkAppAlive();
    });

    // ===== ON-SCREEN KEYBOARD (iOS) =====
    /**
     * iOS lays its keyboard over the page instead of shrinking it, so the bottom of the full-height
     * frame (Remarks, Submit, the lower part of a suggestion list) sat behind it with nothing left to
     * scroll. The frame keeps its size (resizing it re-lays out the whole app, which shows as a lurch);
     * instead the app is told how much of it the keyboard covers, and makes that much room and scrolls
     * the field into view itself (Components.html). The usual keyboard height is remembered here and
     * sent along, so the app can start before iOS reports the keyboard. Android shrinks the page
     * itself, so nothing is covered there and 0 is sent.
     *
     * The frame is never moved. iOS sometimes scrolls this page to show a field the keyboard would
     * cover, and can leave it scrolled after the keyboard closes; the frame is then drawn in one place
     * but tapped in another (taps land above where you touch). This page has nothing to scroll, so any
     * such scroll is undone at once (pinWrapperScroll), and the app does the revealing itself.
     */
    var KEYBOARD_MIN_PX = 100;
    var KEYBOARD_KEY = 'smt-keyboard-h';
    var keyboardTypical = 0;
    var lastKeyboardSent = -1;
    var keyboardFrame = 0;

    try { keyboardTypical = Number(localStorage.getItem(KEYBOARD_KEY)) || 0; } catch (e) {}

    /** The part of the frame below the visible area, less the home-screen gap (which the frame fills on purpose). */
    function measureKeyboard() {
      keyboardFrame = 0;
      var vv = window.visualViewport;
      var frame = document.getElementById('app-frame');
      if (!vv || !frame) return;

      pinWrapperScroll();
      var covered = Math.round(frame.offsetHeight - vv.height - iosGap);
      var inset = covered > KEYBOARD_MIN_PX ? covered : 0;

      if (inset && inset !== keyboardTypical) {
        keyboardTypical = inset;
        try { localStorage.setItem(KEYBOARD_KEY, String(inset)); } catch (e) {}
      }
      sendKeyboard(inset);
    }

    function sendKeyboard(inset) {
      if (!appWindow || inset === lastKeyboardSent) return;
      lastKeyboardSent = inset;
      postToApp({ type: 'KEYBOARD', inset: inset, typical: keyboardTypical });
    }

    /** Puts this page back at the top whenever iOS has scrolled it, so taps line up with the frame. */
    function pinWrapperScroll() {
      if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
    }

    window.addEventListener('scroll', pinWrapperScroll, { passive: true });

    /** iOS fires these many times while the keyboard moves; one measurement per frame is enough. */
    function scheduleKeyboard() {
      if (!keyboardFrame) keyboardFrame = requestAnimationFrame(measureKeyboard);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleKeyboard);
      window.visualViewport.addEventListener('scroll', scheduleKeyboard);
    }

    /** Sends the top safe-area inset to the app. */
    var lastInsetSent = -1;

    function sendSafeArea(force) {
      if (!appWindow) return;

      var probe = document.getElementById('safe-area-probe');
      var inset = probe ? Math.round(probe.getBoundingClientRect().height) : 0;

      if (inset === lastInsetSent && !force) return;
      lastInsetSent = inset;
      postToApp({ type: 'SAFE_AREA', top: inset });
    }

    window.addEventListener('resize', function () { sendSafeArea(false); });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { sendSafeArea(true); }, 100);
    });

    // ===== MESSAGES FROM THE APP =====
    /**
     * Sign-in messages (the app sends them only to this page's origin):
     *   SIGNIN_REQUESTED {requestId, email}   a code was asked for: kept with the page's parameters
     *   SIGNIN_CANCELLED                      Back on the code screen: the request is dropped
     *   SIGNIN_DONE {token, deviceId}         signed in: both kept, the parameters restored, the frame reloaded
     *   TOKEN_RENEWED {token}                 the daily renewal: kept, no reload
     *   SIGNED_OUT                            the token is dropped and the frame reloaded onto the sign-in page
     *   LOCKDOWN                              the kill switch: the token is dropped, the frame left as it is
     */
    window.addEventListener("message", function(event) {
      if (!isFromAppFrame(event.source) || !isTrustedOrigin(event.origin)) return;
      const data = event.data;
      if (!data) return;

      switch (data.type) {
        case "APP_PAINTED":
          appWindow = event.source;
          revealFrame();
          return;

        case "APP_ALIVE":
          if (aliveNonce && data.nonce === aliveNonce) cancelAliveCheck();
          return;

        case "APP_READY":
          appWindow = event.source;
          sendSafeArea(true);
          lastKeyboardSent = -1;
          measureKeyboard();
          return;

        case "WRAPPER_PING":
          try { event.source.postMessage({ type: "WRAPPER_PONG", nonce: data.nonce }, event.origin); } catch (e) {}
          return;

        case "SIGNIN_REQUESTED":
          if (!REQUEST_SHAPE.test(data.requestId || "")) return;
          writeStore(PENDING_KEY, JSON.stringify({
            req: data.requestId, email: String(data.email || "").slice(0, 100), query: visibleParams().toString(), at: Date.now()
          }));
          return;

        case "SIGNIN_CANCELLED":
          writeStore(PENDING_KEY, "");
          return;

        case "SIGNIN_DONE": {
          if (!TOKEN_SHAPE.test(data.token || "") || !DEVICE_SHAPE.test(data.deviceId || "")) return;
          const pending = readPending();
          writeStore(TOKEN_KEY, data.token);
          writeStore(DEVICE_KEY, data.deviceId);
          writeStore(PENDING_KEY, "");
          if (pending && pending.query && !visibleParams().toString()) setAddressQuery(pending.query);
          loadApp(false);
          return;
        }

        case "TOKEN_RENEWED":
          if (TOKEN_SHAPE.test(data.token || "")) writeStore(TOKEN_KEY, data.token);
          return;

        case "SIGNED_OUT":
          writeStore(TOKEN_KEY, "");
          loadApp(false);
          return;

        case "LOCKDOWN":
          writeStore(TOKEN_KEY, "");
          return;

        case "RELOAD":
          loadApp(false);
          return;

        /* The app's theme sets the home-screen page colour; its first THEME message also marks first contact. */
        case "THEME": {
          const firstContact = !appWindow;
          appWindow = event.source;
          setStandaloneTheme(data.theme);
          if (firstContact) setTimeout(function () { sendSafeArea(true); }, 0);
          return;
        }

        case "UPDATE_URL": {
          const qs = data.queryString;
          if (typeof qs !== "string" || !/^\?[A-Za-z0-9=&%_.~-]*$/.test(qs)) return;
          const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + qs;
          window.history.replaceState({ path: newUrl }, '', newUrl);
          return;
        }
      }
    });

    // ===== DEBUG OVERLAY (?debug=1) =====
    /** Every value that decides the app's top inset and height, refreshed twice a second. Touches pass through it. */
    function startDebugOverlay() {
      var box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:8px;right:8px;top:35%;z-index:9999;margin:0;padding:10px;' +
          'background:rgba(0,0,0,0.82);color:#7CFC9A;font:12px/1.45 ui-monospace,Menlo,monospace;' +
          'border-radius:10px;pointer-events:none;white-space:pre-wrap';

      var probe = function (css) {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;' + css;
        document.body.appendChild(el);
        return el;
      };
      var units = ['env(safe-area-inset-top, 0px)', 'env(safe-area-inset-bottom, 0px)', '100vh', '100svh', '100lvh', '100dvh']
          .map(function (u) { return { name: u.replace('env(safe-area-inset-', 'env-').replace(', 0px)', ''), el: probe('height:' + u) }; });
      document.body.appendChild(box);

      setInterval(function () {
        var vv = window.visualViewport;
        var frame = document.getElementById('app-frame');
        box.textContent = [
          'mode        ' + (window.navigator.standalone === true ? 'home-screen app' : 'browser tab') +
              ' | display-mode standalone: ' + (window.matchMedia('(display-mode: standalone)').matches ? 'yes' : 'no'),
          'inner       ' + window.innerWidth + ' x ' + window.innerHeight,
          'screen      ' + window.screen.width + ' x ' + window.screen.height,
          'visualVP    ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + ' @ top ' + Math.round(vv.offsetTop) : 'n/a'),
          'iframe      ' + Math.round(frame.getBoundingClientRect().height) + ' tall, top ' + Math.round(frame.getBoundingClientRect().top),
          'keyboard    ' + Math.max(0, lastKeyboardSent) + ' sent | usual ' + keyboardTypical,
          'inset sent  ' + lastInsetSent + ' | ios-gap ' + (getComputedStyle(document.documentElement).getPropertyValue('--ios-gap') || 'none'),
          'signed in   ' + (TOKEN_SHAPE.test(readStore(TOKEN_KEY)) ? 'yes' : 'no') + ' | code request ' + (readPending() ? 'pending' : 'none')
        ].concat(units.map(function (u) {
          return (u.name + '            ').slice(0, 12) + Math.round(u.el.getBoundingClientRect().height);
        })).join('\n');
      }, 500);
    }

    if (DEBUG) startDebugOverlay();

    loadApp(false);
  </script>
</body>
</html>
