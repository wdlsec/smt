<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Lets iOS "Add to Home Screen" open this page as a standalone app, so the redirect can be tested in that mode -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMT Sign-in Test">
<title>SMT Sign-in Test</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); background: #0f1b33; color: #e8eefc; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9fb0d4; font-size: 14px; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 10px; background: #3b6cf6; color: #fff; margin: 0 8px 8px 0; }
  button.ghost { background: #26365c; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 14px; }
  td { padding: 8px; border-bottom: 1px solid #26365c; vertical-align: top; word-break: break-all; }
  td:first-child { color: #9fb0d4; width: 38%; word-break: normal; }
  .ok { color: #5fd38d; } .bad { color: #ff7b7b; }
  #mode { font-size: 13px; color: #9fb0d4; margin-top: 16px; }
</style>
</head>
<body>
<h1>SMT Sign-in Test</h1>
<p class="sub">Checks that a school Google account can sign in through the GitHub page (top-level redirect, no iframe).</p>

<button id="go">Sign in with school account</button>
<button id="clear" class="ghost">Clear result</button>

<div id="out"></div>
<div id="mode"></div>

<script>
// ===== Fill these two in =====
const CLIENT_ID = '86740641648-f64i06eh0ga8hqi4uacjg691e362q3om.apps.googleusercontent.com';
const DOMAIN    = 'moe.edu.sg';          // staff email domain, no @
// =============================
const REDIRECT  = location.origin + location.pathname;   // must be listed exactly under Authorised redirect URIs

const out = document.getElementById('out');
const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');

document.getElementById('mode').textContent =
  'Display mode: ' + ((navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'standalone (home-screen app)' : 'browser tab');

document.getElementById('go').onclick = () => {
  const nonce = rand(), state = rand();
  localStorage.setItem('smtTestNonce', nonce);   // localStorage, so it survives the round trip in the iOS home-screen app
  localStorage.setItem('smtTestState', state);
  const q = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'id_token',
    scope: 'openid email', nonce, state, hd: DOMAIN, prompt: 'select_account'
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q;
};
document.getElementById('clear').onclick = () => { out.textContent = ''; };

// Decodes the JWT payload for display only. The real tracker checks the token on the server (tokeninfo), never trusts this.
function decodePayload(jwt) {
  const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}

function row(label, value, pass) {
  const tr = document.createElement('tr');
  const a = document.createElement('td'); a.textContent = label;
  const b = document.createElement('td'); b.textContent = value;
  if (pass !== undefined) b.className = pass ? 'ok' : 'bad';
  tr.append(a, b); return tr;
}

(function handleReturn() {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);       // strip the token from the address bar
  const table = document.createElement('table');

  if (h.get('error')) {
    table.append(row('Error', h.get('error'), false), row('Details', h.get('error_description') || h.get('error_subtype') || '-'));
    out.append(table); return;
  }
  const idt = h.get('id_token');
  if (!idt) return;

  const p = decodePayload(idt);
  const now = Math.floor(Date.now() / 1000);
  const email = String(p.email || '').toLowerCase();
  table.append(
    row('Email', email || '-'),
    row('Email verified', String(p.email_verified), p.email_verified === true),
    row('hd (hosted domain)', p.hd || '(none: not a Workspace account)', p.hd === DOMAIN),
    row('Email ends @' + DOMAIN, String(email.endsWith('@' + DOMAIN)), email.endsWith('@' + DOMAIN)),
    row('aud matches client ID', String(p.aud === CLIENT_ID), p.aud === CLIENT_ID),
    row('iss', p.iss, /^(https:\/\/)?accounts\.google\.com$/.test(p.iss)),
    row('nonce matches', String(p.nonce === localStorage.getItem('smtTestNonce')), p.nonce === localStorage.getItem('smtTestNonce')),
    row('state matches', String(h.get('state') === localStorage.getItem('smtTestState')), h.get('state') === localStorage.getItem('smtTestState')),
    row('Expires in', Math.round((p.exp - now) / 60) + ' min', p.exp > now),
    row('Token length', idt.length + ' chars')
  );
  localStorage.removeItem('smtTestNonce'); localStorage.removeItem('smtTestState');
  out.append(table);
})();
</script>
</body>
</html>
